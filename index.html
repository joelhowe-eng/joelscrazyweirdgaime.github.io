<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel's Crazy Weird Gaime</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎮 Joel's Crazy Weird Gaime 🎮</h1>

    <p>Enter the 6-digit code:</p>

    <input
        type="text"
        id="codeInput"
        maxlength="6"
        inputmode="numeric"
        placeholder="000000"
    >

    <button id="unlockButton">UNLOCK</button>

    <p id="codeMessage"></p>

    <button id="goButton" disabled>GO!</button>

    <script src="script.js?v=1001"></script>
    
</body>
</html>
